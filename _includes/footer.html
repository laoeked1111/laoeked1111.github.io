<footer class="footer">
  <div class="container">
    <span class="muted">© {{ site.time | date: '%Y' }} {{ site.footer.copyright }} · {{ site.footer.location }}</span>
    <div class="footer-socials">
      {% for network in site.social %}
      <a class="icon-btn" href="{{ network.url }}" target="_blank" rel="noopener" aria-label="{{ network.title }}">
        {% include icons.html icon=network.title %}
      </a>
      {% endfor %}
      <a class="icon-btn" href="mailto:{{ site.email }}" aria-label="Email">
        {% include icons.html icon="email" %}
      </a>
    </div>
  </div>
</footer>
